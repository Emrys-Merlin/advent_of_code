[project]
name = "aoc2026"
version = "0.1.0"
description = "Python solutions for Advent of Code 2026"
requires-python = "~=3.15.0"
dependencies = [
    # aoc-lib is a local Rust extension built by pixi: see [tool.pixi.dependencies]
]

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[project.scripts]
aoc2026 = "aoc2026:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]

[tool.pixi.dependencies]
aoc-lib = { path = "../../aoc_lib" }

[tool.pixi.pypi-dependencies]
aoc2026 = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check"
typecheck = "ty check"
