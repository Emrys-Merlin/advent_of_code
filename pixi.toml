[workspace]
authors = ["Tim Adler <tim@emrys-merlin.de>"]
channels = ["conda-forge"]
name = "advent_of_code"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks.init]
args = ["year", "python"]
cmd = "copier copy --trust templates/aoc-year . --data year={{ year }} --data python_version={{ python }}"


[dependencies]
copier = ">=9.7"
